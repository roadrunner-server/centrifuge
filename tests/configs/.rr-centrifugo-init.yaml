version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php php_test_files/centrifuge_connect.php"

centrifuge:
  # bound on all interfaces so the centrifugo container can reach it through
  # host.docker.internal; on linux that is the bridge gateway, not loopback
  proxy_address: "tcp://0.0.0.0:10001"
  grpc_api_address: "tcp"
  pool:
    num_workers: 1
    destroy_timeout: 5s
